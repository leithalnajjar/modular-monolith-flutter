name: bazaar_workspace
publish_to: none
description: Bazaar, the sample app for "Modular Monolith in Flutter".

environment:
  sdk: ^3.6.0

workspace:
  - apps/bazaar_app
  - apps/kiosk
  - modules/cart
  - modules/cart_api
  - modules/catalog
  - modules/catalog_api
  - modules/checkout
  - modules/checkout_api
  - modules/identity
  - modules/identity_api
  - modules/notifications
  - modules/payments
  - modules/payments_api
  - shared/core
  - shared/event_bus
  - shared/feature_flags
  - shared/module_contract
  - shared/storage
  - shared/ui_kit
  - tools/boundary_check

dev_dependencies:
  lints: ^6.0.0
